
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clinic Service Queue</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-bar">
    <h1>🏥 Clinic Service Queue</h1>
    <span class="badge">Live Desk</span>
  </header>

  <main class="container">

    <!-- Queue Form -->
    <section aria-labelledby="form-heading">
      <h2 id="form-heading">Add to the queue</h2>

      <form id="queue-form" class="queue-form">

        <!-- TODO 1: Patient code label and required input -->
        <div class="field">
          <label for="patient-code">Patient code</label>
          <input
            id="patient-code"
            name="patient-code"
            type="text"
            placeholder="Example: P-104"
            required
          >
        </div>

        <!-- Service Selection -->
        <div class="field">
          <label for="service-type">Service</label>
          <select id="service-type" name="service-type">
            <option value="General consultation">
              General consultation
            </option>
            <option value="Lab test">
              Lab test
            </option>
            <option value="Pharmacy pickup">
              Pharmacy pickup
            </option>
          </select>
        </div>

        <!-- Add Button -->
        <button id="add-button" type="submit">
          Add to queue
        </button>

      </form>
    </section>

    <!-- Waiting Queue -->
    <section id="queue" aria-live="polite">
      <h2>Waiting queue</h2>

      <div id="queue-list">

        <!-- Sample Starting Card -->
        <article class="patient-card">
          <div>
            <p class="code">P-101</p>
            <p class="service">General consultation</p>
          </div>

          <button type="button" class="served-btn">
            Served
          </button>
        </article>

      </div>
    </section>

  </main>

  <script src="app.js" defer></script>

</body>
</html>
